<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Coroner — Northgate</title>
<style>
  :root{--bg:#0b0d10;--panel:#14171c;--line:#252a32;--ink:#e8eaed;--dim:#8b929d;
        --dead:#e5484d;--zombie:#f5a524;--alive:#30a46c;--accent:#7c8cf8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;
         align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:13px}
  main{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 66px)}
  aside{border-right:1px solid var(--line);padding:18px}
  .plabel{font-size:11px;text-transform:uppercase;letter-spacing:.09em;
          color:var(--dim);margin:0 0 10px}
  .proj{padding:11px 13px;border:1px solid var(--line);border-radius:9px;
        margin-bottom:8px;cursor:pointer;background:var(--panel)}
  .proj:hover{border-color:var(--accent)}
  .proj.active{border-color:var(--accent);background:#181c26}
  .proj b{display:block;font-weight:600}
  .proj span{font-size:12px;color:var(--dim)}
  section{padding:24px 28px}
  .controls{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
  button{background:var(--panel);color:var(--ink);border:1px solid var(--line);
         padding:9px 15px;border-radius:8px;cursor:pointer;font-size:14px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#0b0d10;
                 font-weight:600}
  button.on{border-color:var(--dead);color:var(--dead)}
  .cert{border:1px solid var(--line);border-radius:12px;background:var(--panel);
        max-width:860px;overflow:hidden}
  .certhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;
            justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .certtitle{font-size:12px;letter-spacing:.14em;text-transform:uppercase;
             color:var(--dim)}
  .badge{padding:6px 13px;border-radius:999px;font-weight:700;font-size:13px;
         letter-spacing:.04em}
  .b-DECEASED{background:rgba(229,72,77,.14);color:var(--dead);
              border:1px solid rgba(229,72,77,.4)}
  .b-ZOMBIE{background:rgba(245,165,36,.13);color:var(--zombie);
            border:1px solid rgba(245,165,36,.4)}
  .b-ALIVE,.b-InProgress{background:rgba(48,164,108,.13);color:var(--alive);
                         border:1px solid rgba(48,164,108,.4)}
  .rows{padding:6px 20px 16px}
  .row{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:11px 0;
       border-bottom:1px solid #1c2027}
  .row:last-child{border-bottom:0}
  .k{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.07em}
  .v{font-size:15px}
  .v.none{color:var(--dead);font-weight:600}
  .rec{display:inline-block;padding:3px 10px;border-radius:6px;font-weight:700;
       font-size:12px;letter-spacing:.05em;border:1px solid var(--line)}
  .src{display:inline-block;font-size:11px;padding:2px 7px;border-radius:5px;
       margin-right:6px;background:#1b2029;color:var(--dim);border:1px solid #262c36}
  .ev{margin-top:20px;max-width:860px}
  .evitem{border:1px solid var(--line);border-radius:9px;padding:11px 13px;
          margin-bottom:8px;background:#101319;font-size:13px}
  .evmeta{color:var(--dim);font-size:11px;margin-bottom:5px}
  .ask{margin-top:22px;max-width:860px;display:flex;gap:8px}
  .ask input{flex:1;background:var(--panel);border:1px solid var(--line);
             color:var(--ink);padding:10px 13px;border-radius:8px;font-size:14px}
  .answer{margin-top:12px;padding:13px;border-left:3px solid var(--accent);
          background:#101319;border-radius:0 8px 8px 0;max-width:860px;display:none}
  .muted{color:var(--dim)}
  .spin{color:var(--dim);font-style:italic}
</style>
</head>
<body>
<header>
  <h1>⚰︎ The Coroner</h1>
  <span class="sub">Northgate Inc · threshold: dead after {{ threshold }} days of no work</span>
</header>
<main>
  <aside>
    <p class="plabel">Projects · all marked “In Progress”</p>
    {% for p in projects %}
      <div class="proj" data-slug="{{ p.slug }}">
        <b>{{ p.display }}</b><span>Linear: In Progress</span>
      </div>
    {% endfor %}
  </aside>
  <section>
    <div class="controls">
      <button class="primary" id="run">Run autopsy</button>
      <button id="scope" data-scope="all">Sources: all four</button>
      <span class="muted" id="status"></span>
    </div>
    <div id="out"><p class="muted">Select a project, then run the autopsy.</p></div>
  </section>
</main>

<script>
let slug = null, scope = "all", lastCert = null;
const $ = s => document.querySelector(s);

document.querySelectorAll(".proj").forEach(el => el.onclick = () => {
  document.querySelectorAll(".proj").forEach(p => p.classList.remove("active"));
  el.classList.add("active");
  slug = el.dataset.slug;
});

$("#scope").onclick = () => {
  const b = $("#scope");
  scope = scope === "all" ? "linear" : "all";
  b.dataset.scope = scope;
  b.textContent = scope === "all" ? "Sources: all four" : "Sources: LINEAR ONLY";
  b.classList.toggle("on", scope === "linear");
  if (lastCert) run();
};

$("#run").onclick = run;

async function run() {
  if (!slug) { $("#status").textContent = "pick a project first"; return; }
  $("#status").innerHTML = '<span class="spin">querying ' +
    (scope === "all" ? "4 connectors" : "linear only") + '…</span>';
  try {
    const r = await fetch(`/api/autopsy?project=${slug}&scope=${scope}`);
    const c = await r.json();
    lastCert = c;
    render(c);
    $("#status").textContent = c.stored ? "stored in InsForge" : "";
  } catch (e) {
    $("#status").textContent = "error: " + e;
  }
}

function esc(s){return (s??"").toString().replace(/[<>&]/g,m=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[m]))}
function none(v, fallback){ return v ? esc(v) : `<span class="v none">${fallback}</span>`; }

function render(c) {
  const cls = "b-" + (c.verdict || "").replace(/\s/g, "");
  const days = Object.entries(c.days_by_source || {})
    .map(([k, v]) => `<span class="src">${k} · ${v}d</span>`).join("") ||
    '<span class="src">no sources in scope</span>';

  let rows = `
    <div class="row"><div class="k">Verdict</div><div class="v">${esc(c.verdict)}
      <span class="muted">(confidence ${c.confidence})</span></div></div>
    <div class="row"><div class="k">Finding</div><div class="v">${esc(c.reason)}</div></div>
    <div class="row"><div class="k">Time of death</div><div class="v">
      ${none(c.time_of_death, "UNKNOWN — no work evidence in scope")}</div></div>
    <div class="row"><div class="k">Cause of death</div><div class="v">
      ${none(c.cause, "UNDETERMINED")}</div></div>
    <div class="row"><div class="k">Survived by</div><div class="v">
      ${none(c.survived_by, "NONE KNOWN")}</div></div>`;

  if (c.recommendation) {
    rows += `<div class="row"><div class="k">Recommendation</div><div class="v">
      <span class="rec">${esc(c.recommendation)}</span> ${esc(c.reasoning || "")}</div></div>`;
  }
  if (c.alternative) {
    rows += `<div class="row"><div class="k">Alternative</div>
      <div class="v">${esc(c.alternative)}</div></div>`;
  }
  if (c.eulogy) {
    rows += `<div class="row"><div class="k">Eulogy</div>
      <div class="v"><em>${esc(c.eulogy)}</em></div></div>`;
  }
  rows += `<div class="row"><div class="k">Evidence</div><div class="v">
    ${c.evidence_count} items ${days}</div></div>`;

  const ev = (c.evidence || []).slice(0, 6).map(e => `
    <div class="evitem"><div class="evmeta">${esc(e.provider)} · ${esc(e.timestamp)}
      ${e.author ? "· " + esc(e.author) : ""}</div>${esc(e.text)}</div>`).join("");

  $("#out").innerHTML = `
    <div class="cert">
      <div class="certhead">
        <div><div class="certtitle">Certificate of Death</div>
          <div style="font-size:19px;font-weight:600">${esc(c.project)}</div></div>
        <div class="badge ${cls}">${esc(c.verdict)}</div>
      </div>
      <div class="rows">${rows}</div>
    </div>
    <div class="ev">${ev}</div>
    <div class="ask">
      <input id="q" placeholder="Ask a follow-up: why review starvation? who should own this?">
      <button id="askbtn">Ask</button>
    </div>
    <div class="answer" id="answer"></div>`;

  $("#askbtn").onclick = ask;
  $("#q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
}

async function ask() {
  const q = $("#q").value.trim();
  if (!q || !lastCert) return;
  const a = $("#answer");
  a.style.display = "block";
  a.innerHTML = '<span class="spin">thinking…</span>';
  const r = await fetch("/api/ask", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({question: q, evidence: lastCert.evidence,
                          project: lastCert.project})
  });
  const d = await r.json();
  a.textContent = d.answer || "(no answer)";
}
</script>
</body>
</html>
